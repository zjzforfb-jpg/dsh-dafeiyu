<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050a18" />
<title>大肥鱼 · 能力图谱</title>
<style>
  :root{
    --ink:#e8f1ff;
    --ink-dim:#8ea6cc;
    --ink-faint:#5d739b;
    --line:rgba(125,165,255,.16);
    --glass:rgba(12,22,48,.62);
    --ok:#4ae3b0;
    --beta:#ffc45c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 780px at 50% 42%, #12275c 0%, #0a1330 42%, #050a18 72%, #03060f 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .scrim{
    position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
    background:radial-gradient(120% 90% at 78% 50%, rgba(3,7,18,.62) 0%, rgba(3,7,18,.34) 42%, rgba(3,7,18,0) 68%);
    transition:opacity .45s ease;
  }
  .scrim.on{opacity:1;}

  /* vignette + grain */
  .veil{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(2,5,14,.55) 78%, rgba(2,5,14,.86) 100%);
    mix-blend-mode:multiply;
  }
  .grain{
    position:fixed;inset:-50%;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
    animation:grainShift 6s steps(6) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
    60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}
  }

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;padding:clamp(22px,3.4vw,44px) clamp(20px,3.6vw,56px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    pointer-events:none;z-index:5;
  }
  header::before{
    content:"";position:absolute;inset:-8% -4% auto -4%;height:150%;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,9,22,.92) 0%, rgba(4,9,22,.62) 46%, rgba(4,9,22,0) 100%);
  }
  .brand .eyebrow{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;
    font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(140,175,235,.72);
    display:flex;align-items:center;gap:10px;
  }
  .brand .eyebrow::before{
    content:"";width:22px;height:1px;background:linear-gradient(90deg,rgba(120,170,255,.9),transparent);
  }
  h1{
    margin:14px 0 0;
    font-size:clamp(26px,2.9vw,42px);
    font-weight:650;letter-spacing:.02em;line-height:1.1;
    background:linear-gradient(100deg,#ffffff 8%,#bcd6ff 46%,#7ea6ff 78%,#c9b6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(90,140,255,.30));
  }
  .sub{
    margin:12px 0 0;font-size:13px;color:var(--ink-dim);letter-spacing:.04em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sub #counts{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;
    color:rgba(150,182,235,.8);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px;
    background:rgba(20,36,74,.35);
  }
  .mode-btn{
    position:absolute;top:26px;right:152px;
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:#c7d7ff;background:rgba(70,110,220,.16);border:1px solid rgba(120,160,255,.32);
    border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(8px);
    transition:background .18s,border-color .18s,color .18s;
  }
  .mode-btn:hover{background:rgba(90,135,255,.28);border-color:rgba(150,185,255,.5);color:#eaf1ff;}
  .mode-btn:active{transform:translateY(1px);}
  @media (max-width:760px){ .mode-btn{display:none;} }
  .status-dot{
    display:inline-flex;align-items:center;gap:8px;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;
    letter-spacing:.18em;color:rgba(150,182,235,.75);text-transform:uppercase;
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;
    background:rgba(12,24,52,.4);backdrop-filter:blur(8px);
  }
  .status-dot i{
    width:6px;height:6px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 10px var(--ok);animation:blip 2.4s ease-in-out infinite;
  }
  @keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

  /* ---------- legend / hint ---------- */
  .legend{
    position:fixed;left:clamp(20px,3.6vw,56px);bottom:clamp(20px,3vw,40px);
    display:flex;gap:18px;font-size:11.5px;color:var(--ink-faint);
    letter-spacing:.06em;z-index:5;pointer-events:none;
  }
  .legend span{display:flex;align-items:center;gap:7px;}
  .legend b{width:5px;height:5px;border-radius:50%;display:inline-block;}
  .legend .s{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .legend .b{background:var(--beta);box-shadow:0 0 8px var(--beta);}
  .hint{
    position:fixed;left:50%;bottom:clamp(20px,3vw,38px);transform:translateX(-50%);
    font-size:11.5px;letter-spacing:.22em;color:rgba(140,170,220,.55);
    z-index:5;pointer-events:none;white-space:nowrap;
    transition:opacity .5s ease;
  }
  .hint.dim{opacity:.25;}

  /* ---------- detail panel ---------- */
  #panel{
    position:fixed;top:50%;right:clamp(16px,3vw,52px);
    width:min(392px,calc(100vw - 32px));
    transform:translateY(-50%) translateX(26px);
    opacity:0;pointer-events:none;
    background:linear-gradient(165deg,rgba(16,29,62,.965),rgba(7,13,30,.975));
    border:1px solid rgba(120,162,255,.22);
    border-radius:22px;
    padding:26px 26px 22px;
    backdrop-filter:blur(26px) saturate(150%);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(180,210,255,.14);
    transition:opacity .38s ease, transform .38s cubic-bezier(.22,.9,.28,1);
    z-index:8;overflow:auto;max-height:min(76vh,660px);
  }
  #panel.open{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0);}
  #panel::before{
    content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
    background:radial-gradient(420px 200px at 18% -10%, rgba(110,160,255,.20), transparent 70%);
  }
  .p-head{display:flex;align-items:center;gap:14px;position:relative;}
  .p-icon{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;
    background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--c) 38%, transparent), rgba(10,18,40,.7));
    border:1px solid color-mix(in srgb, var(--c) 45%, transparent);
    box-shadow:0 0 26px -6px var(--c), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .p-titles{flex:1;min-width:0;}
  .p-titles h2{margin:0;font-size:19px;font-weight:640;letter-spacing:.02em;}
  .p-titles code{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;
    color:rgba(146,176,228,.72);letter-spacing:.04em;
  }
  .pill{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;padding:5px 10px;border-radius:999px;white-space:nowrap;
  }
  .pill.ok{color:#8cf5d4;background:rgba(74,227,176,.12);border:1px solid rgba(74,227,176,.32);}
  .pill.beta{color:#ffd68a;background:rgba(255,196,92,.12);border:1px solid rgba(255,196,92,.32);}
  .p-tag{
    position:relative;margin:18px 0 4px;font-size:13px;line-height:1.7;
    color:rgba(180,204,240,.86);letter-spacing:.02em;
  }
  .p-list{position:relative;list-style:none;padding:0;margin:14px 0 0;}
  .p-list li{
    position:relative;padding:9px 0 9px 18px;font-size:12.5px;line-height:1.66;
    color:rgba(168,192,228,.82);border-top:1px solid rgba(120,160,230,.10);
  }
  .p-list li:first-child{border-top:0;}
  .p-list li::before{
    content:"";position:absolute;left:2px;top:17px;width:5px;height:5px;border-radius:50%;
    background:rgba(120,170,255,.75);box-shadow:0 0 10px rgba(110,160,255,.9);
  }
  .p-files{position:relative;margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .p-files span{
    width:100%;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9.5px;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(120,150,205,.65);margin-bottom:2px;
  }
  .p-files code{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;
    color:rgba(160,190,238,.85);background:rgba(70,110,200,.14);
    border:1px solid rgba(110,150,230,.18);border-radius:7px;padding:4px 8px;
  }
  .p-link{
    position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:20px;
    font-size:12px;color:#bcd7ff;text-decoration:none;letter-spacing:.06em;
    border-bottom:1px solid rgba(140,180,255,.35);padding-bottom:3px;
    transition:color .2s,border-color .2s;
  }
  .p-link:hover{color:#fff;border-color:#fff;}

  /* ---------- mobile list ---------- */
  .list{display:none;}
  @media (max-width:760px){
    body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
    #scene,.veil,.grain,.scrim,.legend,.hint,#panel{display:none !important;}
    header{position:static;padding:20px 20px 6px;display:block;}
    header::before{
    content:"";position:absolute;inset:-8% -4% auto -4%;height:150%;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,9,22,.92) 0%, rgba(4,9,22,.62) 46%, rgba(4,9,22,0) 100%);
  }
  .brand .eyebrow{font-size:9.5px;letter-spacing:.26em;}
    h1{font-size:30px;margin-top:10px;}
    .sub{margin-top:10px;font-size:12px;gap:8px;}
    .mode-btn{
    position:absolute;top:26px;right:152px;
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:#c7d7ff;background:rgba(70,110,220,.16);border:1px solid rgba(120,160,255,.32);
    border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(8px);
    transition:background .18s,border-color .18s,color .18s;
  }
  .mode-btn:hover{background:rgba(90,135,255,.28);border-color:rgba(150,185,255,.5);color:#eaf1ff;}
  .mode-btn:active{transform:translateY(1px);}
  @media (max-width:760px){ .mode-btn{display:none;} }
  .status-dot{position:absolute;top:22px;right:18px;padding:5px 10px;font-size:9px;}
    .list{
      display:block;padding:10px 16px 48px;
      background:radial-gradient(760px 520px at 50% 0%, rgba(30,64,140,.32), transparent 70%);
    }
    .hero{position:relative;display:grid;place-items:center;padding:6px 0 18px;}
    .hero img{width:min(62vw,270px);height:auto;filter:drop-shadow(0 18px 40px rgba(60,110,255,.45));}
    .hero::after{
      content:"";position:absolute;bottom:14px;width:52%;height:18px;border-radius:50%;
      background:radial-gradient(ellipse at center, rgba(80,140,255,.32), transparent 70%);
      filter:blur(6px);z-index:-1;
    }
    .card{
      position:relative;display:flex;gap:12px;align-items:flex-start;
      padding:14px 15px;margin-bottom:10px;border-radius:16px;
      background:linear-gradient(160deg, rgba(20,36,72,.72), rgba(8,14,32,.78));
      border:1px solid rgba(120,162,255,.16);
      box-shadow:inset 0 1px 0 rgba(180,210,255,.09);
    }
    .c-icon{
      flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;
      background:radial-gradient(circle at 32% 22%, color-mix(in srgb, var(--c) 40%, transparent), rgba(10,18,40,.72));
      border:1px solid color-mix(in srgb, var(--c) 42%, transparent);
      box-shadow:0 0 20px -6px var(--c);
    }
    .c-body{flex:1;min-width:0;}
    .c-top{display:flex;align-items:center;gap:8px;}
    .c-top h3{margin:0;font-size:14.5px;font-weight:620;letter-spacing:.01em;}
    .c-top code{
      font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9.5px;color:rgba(140,170,220,.6);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .c-top .pill{margin-left:auto;font-size:8.5px;padding:3px 7px;letter-spacing:.12em;}
    .c-tag{margin:6px 0 0;font-size:12px;line-height:1.55;color:rgba(168,192,228,.82);}
    .c-pts{margin:8px 0 0;padding:0;list-style:none;display:none;}
    .card.open .c-pts{display:block;}
    .c-pts li{
      position:relative;padding:5px 0 5px 14px;font-size:11.5px;line-height:1.55;
      color:rgba(150,176,214,.78);
    }
    .c-pts li::before{
      content:"";position:absolute;left:1px;top:12px;width:4px;height:4px;border-radius:50%;
      background:rgba(120,170,255,.8);
    }
    .c-more{
      margin-top:8px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:9px;
      letter-spacing:.16em;text-transform:uppercase;color:rgba(120,160,220,.55);
    }
  }

  @media (max-width:820px){
    header{padding:20px 20px;}
    .hint{display:none;}
    #panel{
      top:auto;bottom:0;right:0;left:0;width:100%;
      transform:translateY(104%);border-radius:22px 22px 0 0;
      max-height:62vh;
    }
    #panel.open{transform:translateY(0);}
    .legend{display:none;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="veil"></div>
<div class="grain"></div>
<div class="scrim" id="scrim"></div>

<header>
  <div class="brand">
    <div class="eyebrow">Dafeiyu · Capability Orbit</div>
    <h1>大肥鱼 · 能力图谱</h1>
    <div class="sub">
      <span id="counts">12 项能力</span>
      <span>渐进式披露 · 点击气泡看细节</span>
    </div>
  </div>
  <button class="mode-btn" id="fish-mode" title="切换角色渲染方式">3D 模型</button>
  <div class="status-dot"><i></i>online</div>
</header>

<aside id="panel"><div id="panel-body"></div></aside>
<section class="list" id="list"></section>

<div class="legend">
  <span><b class="s"></b>stable</span>
  <span><b class="b"></b>beta</span>
</div>
<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击气泡</div>

<script>/*__THREE__*/</script>
<script>window.__FISH_SRC__ = "data:image/webp;base64,__FISH_B64__";</script>
<script>window.__FISH_MESH__ = /*__FISH_MESH__*/null;</script>
<script>/*__APP__*/</script>
</body>
</html>
